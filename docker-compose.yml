services:
  prestashop-db:
    image: mariadb:10.6
    container_name: prestashop-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: prestashop
      MYSQL_DATABASE: prestashop
      MYSQL_USER: prestashop
      MYSQL_PASSWORD: prestashop
    volumes:
      - presta-db-data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - prestashop_network

  prestashop:
    image: prestashop/prestashop:latest
    container_name: prestashop
    restart: unless-stopped
    depends_on:
      - prestashop-db
    ports:
      - "8080:80"
    environment:
      DB_SERVER: prestashop-db
      DB_NAME: prestashop
      DB_USER: prestashop
      DB_PASSWD: prestashop
      PS_INSTALL_AUTO: "1"
      PS_DOMAIN: localhost:8080
      PS_FOLDER_ADMIN: admin-dev
      PS_FOLDER_INSTALL: install-dev
    volumes:
      - presta-data:/var/www/html
      - type: bind
        source: ./modules
        target: /var/www/html/modules
      - type: bind
        source: ./themes
        target: /var/www/html/themes
    networks:
      - prestashop_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: prestashop-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: prestashop-db
      PMA_PORT: 3306
      PMA_ARBITRARY: "1"
    ports:
      - "8081:80"
    depends_on:
      - prestashop-db
    networks:
      - prestashop_network

networks:
  prestashop_network:
    driver: bridge

volumes:
  presta-data:
  presta-db-data:
